<body>
<div class="app">
  <header class="topbar"><button class="pill" id="musicBtn" type="button" aria-pressed="true" aria-label="Music: ON">🎵 Music: ON</button><button class="pill hidden" id="menuBtn" type="button" aria-label="Return to start menu">🏠 Menu</button></header>
  <main>
    <section class="screen panel start-panel" id="startScreen" aria-labelledby="gameTitle">
      <span class="eyebrow">A happy little number adventure</span>
      <h1 class="logo" id="gameTitle">Count &amp; Play!</h1>
      <p class="subtitle">Count, add, and take away with your new friends. Can you reach the finish?</p>
      <div class="mascots" aria-hidden="true"><span>🐻</span><span>🍓</span><span>🐸</span><span>🚀</span><span>🐥</span></div>
      <button class="primary" id="playBtn" type="button">Play! <span aria-hidden="true">▶️</span></button>
      <p class="hint">Get 10 stars in each stage. You have 3 hearts! 💛💛💛</p>
    </section>

    <section class="screen hidden" id="gameScreen" aria-label="Counting game">
      <div class="hud" aria-label="Game progress">
        <div class="hud-chip stage-chip" id="stageLabel">Stage 1 / 20</div>
        <div class="hud-chip hearts" id="hearts" aria-label="3 hearts left">💛💛💛</div>
        <div class="hud-chip" id="scoreLabel">⭐ 0 / 10</div>
        <div class="progress-wrap"><span class="progress-label">STAGE STARS</span><div class="progress-track" role="progressbar" aria-label="Stage stars" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div><span class="progress-label" id="progressText">0 / 10</span></div>
      </div>
      <div class="panel game-panel">
        <h2 class="qtitle" id="questionTitle">How many do you see?</h2>
        <div class="visual" id="visual" aria-label="Question objects"></div>
        <div class="equation-line" id="equationLine" aria-live="polite"></div>
        <div class="answers" id="answers" role="group" aria-label="Choose an answer"></div>
        <div class="feedback" id="feedback" aria-live="polite" aria-atomic="true"></div>
      </div>
    </section>

    <section class="screen hidden" id="resultScreen" aria-live="polite" aria-labelledby="resultTitle">
      <div class="panel stage-result">
        <div class="result-emoji" id="resultEmoji" aria-hidden="true">🎉</div>
        <h1 id="resultTitle">You did it!</h1>
        <p id="resultMessage">You passed the stage!</p>
        <button class="primary" id="continueBtn" type="button">Next stage! <span aria-hidden="true">🚀</span></button>
      </div>
    </section>
  </main>
  <div class="sr-only" id="announcement" aria-live="assertive" aria-atomic="true"></div>
</div>
<script>
(()=>{
  'use strict';
  const $=id=>document.getElementById(id);
  const startScreen=$('startScreen'),gameScreen=$('gameScreen'),resultScreen=$('resultScreen');
  const musicBtn=$('musicBtn'),menuBtn=$('menuBtn'),playBtn=$('playBtn'),continueBtn=$('continueBtn');
  const stageLabel=$('stageLabel'),heartsEl=$('hearts'),scoreLabel=$('scoreLabel'),progressFill=$('progressFill'),progressText=$('progressText'),progressBar=document.querySelector('[role="progressbar"]');
  const questionTitle=$('questionTitle'),visual=$('visual'),equationLine=$('equationLine'),answers=$('answers'),feedback=$('feedback'),announcement=$('announcement');
  const resultEmoji=$('resultEmoji'),resultTitle=$('resultTitle'),resultMessage=$('resultMessage');
  const objects=['🍎','🍓','🍊','🍌','🍇','🍉','🍐','🍒','🥕','🍪','🧸','🚗','🐥','🐸','🐞','🦋','⭐','🎈','🧁','🐠','🚀','⚽'];
  const cheer=['Super counting!','You got it!','Wonderful!','Amazing!','Hooray!'];
  let stage=1,score=0,hearts=3,current=null,lastKey='',musicOn=true,audioCtx=null,master=null,loopTimer=null,noteStep=0;
  const melody=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,587.33,659.25,523.25,440,523.25,659.25,587.33];

  function audioStart(){if(!musicOn)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx){audioCtx=new AC();master=audioCtx.createGain();master.gain.value=.12;master.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume();if(loopTimer)return;playNote();loopTimer=setInterval(playNote,260)}
  function playNote(){if(!audioCtx||!musicOn)return;const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=melody[noteStep%melody.length];gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.22,now+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+.21);osc.connect(gain);gain.connect(master);osc.start(now);osc.stop(now+.23);if(noteStep%4===0){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=melody[noteStep%melody.length]/2;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.07,now+.03);g.gain.exponentialRampToValueAtTime(.0001,now+.19);o.connect(g);g.connect(master);o.start(now);o.stop(now+.2)}noteStep++}
  function toggleMusic(){musicOn=!musicOn;musicBtn.textContent=(musicOn?'🎵 Music: ON':'🔇 Music: OFF');musicBtn.setAttribute('aria-pressed',String(musicOn));musicBtn.setAttribute('aria-label','Music: '+(musicOn?'ON':'OFF'));if(musicOn)audioStart();else if(audioCtx&&master)master.gain.setTargetAtTime(0,audioCtx.currentTime,.015);if(musicOn&&master)master.gain.setTargetAtTime(.12,audioCtx.currentTime,.04)}
  function show(which){startScreen.classList.toggle('hidden',which!=='start');gameScreen.classList.toggle('hidden',which!=='game');resultScreen.classList.toggle('hidden',which!=='result');menuBtn.classList.toggle('hidden',which==='start')}
  function rangeFor(s){if(s<=3)return Math.min(5+s-1,7);if(s<=6)return 5+Math.floor((s-4)/2);if(s<=10)return 6+Math.floor((s-7)/2);if(s<=15)return 8+Math.floor((s-11)/2);return 11+Math.floor((s-16)/2)}
  function modeFor(s){if(s<=3)return'count';if(s===4)return'add';if(s===5)return'sub';if(s<=8)return Math.random()<.52?'add':'sub';return Math.random()<.5?'add':'sub'}
  function chooseObject(){let x=objects[Math.floor(Math.random()*objects.length)];if(current&&current.emoji===x)x=objects[(objects.indexOf(x)+3)%objects.length];return x}
  function makeQuestion(){let mode=modeFor(stage),max=rangeFor(stage),a,b,answer,emoji=chooseObject();if(mode==='count'){answer=1+Math.floor(Math.random()*max);return{mode,emoji,a:answer,answer,key:'c:'+emoji+':'+answer}}
    if(mode==='add'){const cap=stage<=4?4:Math.min(max,15);a=1+Math.floor(Math.random()*(cap-1));b=1+Math.floor(Math.random()*(cap-a));if(a+b>cap)b=cap-a;answer=a+b;return{mode,emoji,a,b,answer,key:'a:'+a+':'+b+':'+emoji}}
    const cap=stage<=5?4:Math.min(max,15);a=2+Math.floor(Math.random()*(cap-1));b=1+Math.floor(Math.random()*(a-1));answer=a-b;return{mode,emoji,a,b,answer,key:'s:'+a+':'+b+':'+emoji}}
  function nextQuestion(){let q,tries=0;do{q=makeQuestion();tries++}while(q.key===lastKey&&tries<15);current=q;lastKey=q.key;renderQuestion()}
  function groupMarkup(emoji,n){let chunks=[];for(let i=0;i<n;i++)chunks.push(emoji);return chunks.join(' ')}
  function renderQuestion(){questionTitle.textContent=current.mode==='count'?'How many do you see?':'What is the answer?';visual.replaceChildren();equationLine.textContent='';
    if(current.mode==='count'){const g=document.createElement('div');g.className='group single';g.textContent=groupMarkup(current.emoji,current.a);g.setAttribute('aria-label',current.a+' '+(current.a===1?'object':'objects'));visual.append(g)}
    else{const left=document.createElement('div'),op=document.createElement('span'),right=document.createElement('div');left.className='group';right.className='group';left.textContent=groupMarkup(current.emoji,current.a);right.textContent=groupMarkup(current.emoji,current.b);left.setAttribute('aria-label',current.a+' '+(current.a===1?'object':'objects'));right.setAttribute('aria-label',current.b+' '+(current.b===1?'object':'objects'));op.className='operator';op.textContent=current.mode==='add'?'+':'−';op.setAttribute('aria-label',current.mode==='add'?'plus':'minus');visual.append(left,op,right);equationLine.textContent=current.a+' '+(current.mode==='add'?'+':'−')+' '+current.b+' = ?'}
    visual.setAttribute('aria-label',current.mode==='count'?'Count the objects':(current.mode==='add'?'Add the two groups':'Take away the second group'));
    feedback.textContent='';answers.replaceChildren();answers.classList.remove('locked');const opts=new Set([current.answer]);while(opts.size<3){let n=current.answer+(Math.floor(Math.random()*5)-2);if(n<0)n=current.answer+Math.ceil(Math.random()*3);if(n!==current.answer)opts.add(n)}const shuffled=[...opts].sort(()=>Math.random()-.5);shuffled.forEach((n,i)=>{const btn=document.createElement('button');btn.className='answer';btn.type='button';btn.textContent=String(n);btn.setAttribute('aria-label','Answer '+n);btn.addEventListener('click',()=>answerClick(btn,n));answers.append(btn)});announcement.textContent=current.mode==='count'?'Count the objects and choose an answer.':'Solve the number puzzle and choose an answer.'}
  function updateHud(){stageLabel.textContent='Stage '+stage+' / 20';heartsEl.textContent='💛'.repeat(hearts)+'🩶'.repeat(3-hearts);heartsEl.setAttribute('aria-label',hearts+' '+(hearts===1?'heart':'hearts')+' left');scoreLabel.textContent='⭐ '+score+' / 10';progressText.textContent=score+' / 10';progressFill.style.width=(score*10)+'%';progressBar.setAttribute('aria-valuenow',String(score))}
  function answerClick(btn,n){if(btn.disabled)return;audioStart();if(n===current.answer){btn.classList.add('correct');btn.disabled=true;answers.querySelectorAll('button').forEach(b=>b.disabled=true);score++;updateHud();feedback.innerHTML='<span class="big-star" aria-hidden="true">🌟</span>'+cheer[Math.floor(Math.random()*cheer.length)];announcement.textContent='Correct! '+cheer[Math.floor(Math.random()*cheer.length)];if(score>=10){setTimeout(()=>showResult(true),800)}else{setTimeout(nextQuestion,720)}}else{btn.classList.add('wrong');btn.disabled=true;hearts--;updateHud();feedback.textContent='Good try! Have another go!';announcement.textContent='Not quite. Try another answer.';gameScreen.querySelector('.game-panel').classList.remove('shake-screen');void gameScreen.offsetWidth;gameScreen.querySelector('.game-panel').classList.add('shake-screen');if(hearts<=0){answers.querySelectorAll('button').forEach(b=>b.disabled=true);setTimeout(()=>showResult(false),650)}}}
  function showResult(passed){show('result');if(passed){resultEmoji.textContent=stage===20?'🏆🎉':'🎉🌟';resultTitle.textContent=stage===20?'You are a Number Star!':'Stage '+stage+' passed!';resultMessage.textContent=stage===20?'You finished all 20 stages. Fantastic counting, adding, and taking away!':'You earned 10 stars and passed Stage '+stage+'. You are doing a wonderful job!';continueBtn.innerHTML=stage===20?'Play again! <span aria-hidden="true">🔁</span>':'Next stage! <span aria-hidden="true">🚀</span>';announcement.textContent=stage===20?'You won! You finished all 20 stages!':'Stage '+stage+' passed. Great job!'}else{resultEmoji.textContent='🧸💛';resultTitle.textContent='Try again!';resultMessage.textContent='That was a tricky one. Take a little breath, then try Stage '+stage+' again!';continueBtn.innerHTML='Restart stage <span aria-hidden="true">🔄</span>';announcement.textContent='You ran out of hearts. You can restart this stage.'}}
  function beginStage(){score=0;hearts=3;updateHud();show('game');nextQuestion();$('questionTitle').focus?.()}
  playBtn.addEventListener('click',()=>{audioStart();stage=1;beginStage()});musicBtn.addEventListener('click',toggleMusic);menuBtn.addEventListener('click',()=>{show('start');announcement.textContent='Back at the start menu.'});continueBtn.addEventListener('click',()=>{audioStart();if(stage===20&&score===10)stage=1;else if(score===10)stage++;beginStage()});
})();
</script>
